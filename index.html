<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="css/main.css">
    <title>Tactics - 2D Engine</title>
</head>
<body>
    <div id="container">
        <canvas id="tactics">
            <img src="img/tactics.jpg" alt="Tactics Logo" size="50">
        </canvas>

        <!-- Panel de Información Superior (Persiana) -->
        <div id="info-panel" class="panel top-panel folded">
            <div class="panel-header">
                <span class="panel-title">Estado del Motor</span>
                <button id="toggle-info" class="toggle-btn">▲</button>
            </div>
            <div class="panel-content">
                <div id="status-indicators">
                    <p id="info-tokens">TOKENS: - / -</p>
                    <p id="info-fps">FPS: - / -</p>
                    <p id="info-cycle">Ciclo: -ms / -ms</p>
                    <p id="info-engine">Log: -</p>
                </div>
                <div id="shortcuts">
                    <hr>
                    <strong>Atajos de Teclado:</strong>
                    <ul>
                        <li><kbd>WASD / Flechas</kbd>: Mover / Girar</li>
                        <li><kbd>Espacio</kbd>: Disparar</li>
                        <li><kbd>N</kbd>: Crear Polígono (Editor)</li>
                        <li><kbd>D</kbd>: Borrar trazado</li>
                        <li><kbd>S</kbd>: Demo Línea</li>
                    </ul>
                </div>
                <div id="scene-message"></div>
            </div>
        </div>
    
        <!-- Panel de Control Lateral (Persiana) -->
        <div id="side-panel" class="panel right-panel folded">
            <div class="panel-header">
                <button id="toggle-side" class="toggle-btn">◀</button>
                <span class="panel-title">Opciones de Escena</span>
            </div>
            <div class="panel-content">
                <div id="control">
                    <ul>
                        <li><button id="stopAutomat" class="action-btn">Stop/Go</button></li>
                        <li>
                            <div class="control-group">
                                <input type="checkbox" id="autoFPS"/><label for="autoFPS">Auto FPS</label>
                            </div>
                        </li>
                        <li>
                            <div class="control-group">
                                <input type="checkbox" id="lines"/><label for="lines">Ver Rejilla</label>
                            </div>
                        </li>
                        <li>
                            <div class="control-group">
                                <input type="checkbox" id="colliders"/><label for="colliders">Ver Colisionadores</label>
                            </div>
                        </li>
                        <li>
                            <div class="control-group">
                                <input type="checkbox" id="viewport"/><label for="viewport">Habilitar Viewport</label>
                            </div>
                        </li>
                        <li>
                            <div class="control-group">
                                <input type="checkbox" id="collision"/><label for="collision">Detectar Colisión</label>
                            </div>
                        </li>
                        <li>
                            <div class="control-group">
                                <input type="checkbox" id="ids"/><label for="ids">Ver IDs / Salud</label>
                            </div>
                        </li>
                        <li>
                            <label>Zoom</label>
                            <div class="btn-group">
                                <button id="zoomin">+</button>
                                <button id="zoomout">-</button>
                            </div>
                        </li>
                        <li>
                            <label for="effects">Efecto de Bala</label>
                            <select id="effects"></select>
                        </li>
                        <li>
                            <label for="tokens">Seleccionar Token</label>
                            <select id="tokens"></select>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="lib/tactics.js"></script>
</body>
</html>
